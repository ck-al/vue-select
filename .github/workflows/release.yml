name: Release

on:
  push:
    tags:
      - 'v*' # Any tag starting with a v, e.g. v4.0.0
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment:
      name: release
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test with Coverage
        run: yarn test

      - name: Build project
        run: yarn build

      - name: Archive entire project
        run: |
          rm -f latest.tar.gz latest.zip

          mapfile -d '' archive_entries < <(
            find . \
              -mindepth 1 \
              -maxdepth 1 \
              ! -name '.git' \
              ! -name 'node_modules' \
              ! -name 'latest.tar.gz' \
              ! -name 'latest.zip' \
              -printf '%P\0'
          )

          tar -czf "$RUNNER_TEMP/latest.tar.gz" -- "${archive_entries[@]}"
          zip -r "$RUNNER_TEMP/latest.zip" -- "${archive_entries[@]}"

          cp "$RUNNER_TEMP/latest.tar.gz" latest.tar.gz
          cp "$RUNNER_TEMP/latest.tar.gz" "$RELEASE_TAG.tar.gz"
          cp "$RUNNER_TEMP/latest.zip" latest.zip
          cp "$RUNNER_TEMP/latest.zip" "$RELEASE_TAG.zip"

      - name: Create Release and Upload Artifact
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/*
            latest.tar.gz
            "$RELEASE_TAG.tar.gz"
            latest.zip
            "$RELEASE_TAG.zip"
          token: ${{ secrets.RELEASE_TOKEN }}
