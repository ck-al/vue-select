name: Release

on:
  push:
    tags:
      - 'v*' # Any tag starting with a v, e.g. v4.0.0
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment:
      name: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test with Coverage
        run: yarn test

      - name: Build project
        run: yarn build

      - name: Create dist package.json
        run: |
          version="$(printf '%s' "${{ github.ref_name }}" | sed 's/^[^0-9]*//')"
          cat > dist/package.json <<'EOF'
          {
            "name": "vue-select",
            "version": "$version",
            "main": "vue-select.js",
            "repository": {
              "type": "git",
              "url": "https://github.com/ck-al/vue-select.git"
            },
          }
          EOF

      - name: Zip and Tar distribution
        run: |
          tar -czf "latest.tar.gz" -C dist .
          zip -r "latest.zip" dist

      - name: Create Release and Upload Artifact
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/*
            latest.tar.gz
            latest.zip
          token: ${{ secrets.RELEASE_TOKEN }}
